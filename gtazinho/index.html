<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTAzinho — Playable Preview</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#87CEEB;color:#222;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0}
  canvas{display:block}

  #hud-help{position:fixed;top:14px;left:14px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border:1px solid rgba(255,180,80,0.5);border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.55;z-index:10;max-width:260px;color:#fff}
  #hud-help .title{font-weight:700;color:#FFD24A;letter-spacing:0.06em;text-transform:uppercase;font-size:10px;margin-bottom:5px}
  #hud-help kbd{background:rgba(255,255,255,0.15);padding:1px 5px;border-radius:3px;font-family:"SF Mono",Menlo,monospace;font-size:10px;border:1px solid rgba(255,255,255,0.2)}

  #hud-stats{position:fixed;top:14px;right:14px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border:1px solid rgba(255,210,74,0.5);border-radius:10px;padding:10px 14px;font-family:"SF Mono",Menlo,monospace;z-index:10;min-width:220px;color:#fff}
  #hud-stats .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;font-size:11px}
  #hud-stats .row:last-child{margin-bottom:0}
  #hud-stats .label{color:#bbb;letter-spacing:0.08em;text-transform:uppercase;font-size:9px}
  #hud-stats .v-cash{color:#9EF67C;font-weight:700;font-size:16px}
  #hud-stats .v-jobs{color:#FFB347;font-weight:700;font-size:16px}
  #hp-bar{width:100%;height:8px;background:rgba(255,255,255,0.15);border-radius:4px;overflow:hidden;margin-top:4px}
  #hp-fill{height:100%;background:linear-gradient(90deg,#E94B5C,#FFB347);transition:width .15s}

  #mission{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.78);backdrop-filter:blur(8px);border:2px solid #FFD24A;border-radius:14px;padding:12px 26px;color:#fff;z-index:10;text-align:center;min-width:360px;max-width:92vw}
  #mission .row1{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2px}
  #mission .num{background:#FFD24A;color:#000;font-weight:800;border-radius:6px;padding:2px 8px;font-size:11px;letter-spacing:0.08em;font-family:"SF Mono",Menlo,monospace}
  #mission .label{font-size:10px;color:#FFD24A;letter-spacing:0.18em;text-transform:uppercase;font-weight:700}
  #mission .text{font-size:18px;margin-top:2px;font-weight:600;line-height:1.3}
  #mission .meta{display:flex;justify-content:center;gap:18px;margin-top:6px;font-family:"SF Mono",Menlo,monospace;font-size:11px}
  #mission .meta .reward{color:#9EF67C}
  #mission .meta .dist{color:#FFB347}
  #mission .meta .timer{color:#E94B5C;font-weight:700}
  #mission .meta .timer.ok{color:#9EF67C}

  #speed{position:fixed;bottom:24px;right:24px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border:1px solid rgba(255,179,71,0.5);border-radius:10px;padding:8px 14px;font-family:"SF Mono",Menlo,monospace;font-size:22px;font-weight:700;color:#FFB347;z-index:10;text-align:right}
  #speed small{display:block;font-size:9px;color:#bbb;letter-spacing:0.1em;margin-top:1px;font-weight:400}

  #edge-arrow{position:fixed;width:60px;height:60px;pointer-events:none;z-index:9;display:none;transform:translate(-50%,-50%)}
  #edge-arrow svg{width:100%;height:100%;filter:drop-shadow(0 0 12px rgba(255,210,74,0.8))}

  #toast{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);backdrop-filter:blur(12px);border:2px solid #9EF67C;border-radius:14px;padding:18px 32px;font-weight:700;color:#9EF67C;letter-spacing:0.08em;text-transform:uppercase;font-size:18px;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center}
  #toast.on{opacity:1}
  #toast.bad{border-color:#E94B5C;color:#E94B5C}

  #briefing{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:50;display:none;align-items:center;justify-content:center}
  #briefing.on{display:flex}
  #briefing .panel{background:#1a1a22;border:2px solid #FFD24A;border-radius:14px;padding:30px 36px;color:#fff;max-width:480px;text-align:center}
  #briefing h2{color:#FFD24A;font-size:14px;letter-spacing:0.18em;margin-bottom:8px;text-transform:uppercase}
  #briefing h1{font-size:30px;margin-bottom:12px}
  #briefing p{color:#ccc;line-height:1.5;margin-bottom:18px;font-size:14px}
  #briefing .stats{display:flex;justify-content:center;gap:24px;margin-bottom:20px;font-family:"SF Mono",Menlo,monospace}
  #briefing .stats span{display:block;color:#888;font-size:10px;letter-spacing:0.1em;text-transform:uppercase}
  #briefing .stats b{color:#9EF67C;font-size:18px;font-weight:700}
  #briefing button{background:#FFD24A;color:#000;border:none;border-radius:8px;padding:10px 24px;font-weight:700;font-size:14px;cursor:pointer;letter-spacing:0.1em;text-transform:uppercase;font-family:inherit}
  #briefing button:hover{background:#FFB347}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud-help">
  <div class="title">GTAzinho · alpha</div>
  <kbd>W</kbd>/<kbd>S</kbd> dirige · <kbd>A</kbd>/<kbd>D</kbd> vira<br>
  <kbd>Space</kbd> freio
</div>

<div id="hud-stats">
  <div class="row"><span class="label">cash</span><span class="v-cash" id="cash">$0</span></div>
  <div class="row"><span class="label">jobs</span><span class="v-jobs" id="jobs">0</span></div>
  <div><div class="label">hp</div><div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div></div>
</div>

<div id="mission">
  <div class="row1"><span class="num" id="mission-num">#1</span><span class="label">missão</span></div>
  <div class="text" id="mission-text">…</div>
  <div class="meta">
    <span class="dist" id="mission-dist"></span>
    <span class="timer" id="mission-timer"></span>
    <span class="reward" id="mission-reward"></span>
  </div>
</div>

<div id="speed">0<small>KM/H</small></div>

<div id="edge-arrow">
  <svg viewBox="0 0 60 60">
    <polygon points="30,5 50,40 30,32 10,40" fill="#FFD24A" stroke="#000" stroke-width="2"/>
  </svg>
</div>

<div id="toast"></div>

<div id="briefing">
  <div class="panel">
    <h2>Missão <span id="brf-num">1</span></h2>
    <h1 id="brf-title">DELIVERY</h1>
    <p id="brf-desc">Pega o pacote no marker amarelo e entrega no verde. Sem pressão.</p>
    <div class="stats">
      <div><span>recompensa</span><b id="brf-reward">$300</b></div>
      <div><span>tempo</span><b id="brf-time">∞</b></div>
      <div><span>perseguidores</span><b id="brf-pursuers">0</b></div>
    </div>
    <button id="brf-go">COMEÇAR</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============= scene =============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9CD8FF);
scene.fog = new THREE.Fog(0xCFE9FF, 90, 240);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.5, 500);
camera.up.set(0, 0, -1);

scene.add(new THREE.HemisphereLight(0xCFE9FF, 0x506050, 0.7));
const sun = new THREE.DirectionalLight(0xFFF4D6, 1.0);
sun.position.set(40, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -100; sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100; sun.shadow.camera.bottom = -100;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
scene.add(sun);

// ============= world =============
const WORLD = 220;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD*1.5, WORLD*1.5),
  new THREE.MeshStandardMaterial({ color: 0x88B070, roughness: 1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const roadMat = new THREE.MeshStandardMaterial({ color: 0x4a4a52, roughness: 1 });
const laneMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF });
const ROAD_W = 10;
const ROAD_SPACING = 40;
const roadLines = [-2,-1,0,1,2].map(i => i*ROAD_SPACING);
const buildingObstacles = [];

for (const z of roadLines) {
  const r = new THREE.Mesh(new THREE.PlaneGeometry(WORLD, ROAD_W), roadMat);
  r.rotation.x = -Math.PI/2; r.position.set(0, 0.01, z); r.receiveShadow = true;
  scene.add(r);
  for (let x = -WORLD/2 + 4; x < WORLD/2; x += 8) {
    const s = new THREE.Mesh(new THREE.PlaneGeometry(3, 0.4), laneMat);
    s.rotation.x = -Math.PI/2; s.position.set(x, 0.02, z);
    scene.add(s);
  }
}
for (const x of roadLines) {
  const r = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, WORLD), roadMat);
  r.rotation.x = -Math.PI/2; r.position.set(x, 0.011, 0); r.receiveShadow = true;
  scene.add(r);
  for (let z = -WORLD/2 + 4; z < WORLD/2; z += 8) {
    const s = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 3), laneMat);
    s.rotation.x = -Math.PI/2; s.position.set(x, 0.022, z);
    scene.add(s);
  }
}

const bldgPalette = [0xE8C547, 0xF18F01, 0xC73E1D, 0x4F86C6, 0xA78BFA, 0xE4B7E5, 0x9EC5AB];
for (let i = 0; i < roadLines.length - 1; i++) {
  for (let j = 0; j < roadLines.length - 1; j++) {
    const cx = (roadLines[i] + roadLines[i+1]) / 2;
    const cz = (roadLines[j] + roadLines[j+1]) / 2;
    const blockW = roadLines[i+1] - roadLines[i] - ROAD_W;
    const blockD = roadLines[j+1] - roadLines[j] - ROAD_W;
    const count = 1 + Math.floor(Math.random()*2);
    for (let k = 0; k < count; k++) {
      const w = 8 + Math.random()*8;
      const d = 8 + Math.random()*8;
      const h = 6 + Math.random()*22;
      const ox = (Math.random()-0.5) * (blockW - w - 2);
      const oz = (Math.random()-0.5) * (blockD - d - 2);
      const x = cx + ox, z = cz + oz;
      const color = bldgPalette[Math.floor(Math.random()*bldgPalette.length)];
      const b = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.85 })
      );
      b.position.set(x, h/2, z);
      b.castShadow = true; b.receiveShadow = true;
      scene.add(b);
      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(w*0.95, 0.6, d*0.95),
        new THREE.MeshStandardMaterial({ color: 0x222 })
      );
      roof.position.set(x, h + 0.3, z); scene.add(roof);
      buildingObstacles.push({ pos: new THREE.Vector2(x,z), halfX: w/2, halfZ: d/2 });
    }
  }
}

// ============= car factory =============
function makeCar(bodyColor, roofColor) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(1.8, 0.7, 3.4),
    new THREE.MeshStandardMaterial({ color: bodyColor, metalness: 0.4, roughness: 0.5 })
  );
  body.position.y = 0.5; body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.5, 1.6),
    new THREE.MeshStandardMaterial({ color: roofColor, metalness: 0.2, roughness: 0.4 })
  );
  cabin.position.set(0, 1.05, -0.2); cabin.castShadow = true;
  g.add(cabin);
  for (const sx of [-0.55, 0.55]) {
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), new THREE.MeshBasicMaterial({ color: 0xFFEFB0 }));
    h.position.set(sx, 0.6, 1.7); g.add(h);
  }
  for (const sx of [-0.55, 0.55]) {
    const t = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), new THREE.MeshBasicMaterial({ color: 0xCC2222 }));
    t.position.set(sx, 0.6, -1.7); g.add(t);
  }
  return g;
}

const player = makeCar(0xFF6B35, 0x222);
scene.add(player);
const playerState = {
  pos: new THREE.Vector3(0, 0, 0),
  vel: 0, heading: 0,
  hp: 100, cash: 0, jobs: 0,
  radius: 1.6,
  invuln: 0,
};

// ============= big arrow above player =============
const arrow = (() => {
  const g = new THREE.Group();
  const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 2),
    new THREE.MeshStandardMaterial({ color: 0xFFD24A, emissive: 0xFFD24A, emissiveIntensity: 0.6 }));
  shaft.position.z = 1; g.add(shaft);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.9, 1.4, 4),
    new THREE.MeshStandardMaterial({ color: 0xFFD24A, emissive: 0xFFD24A, emissiveIntensity: 0.6 }));
  head.rotation.x = Math.PI/2; head.rotation.y = Math.PI/4; head.position.z = 2.7; g.add(head);
  g.position.y = 5;
  scene.add(g);
  return g;
})();

// ============= mission progression =============
function getMissionConfig(n) {
  // n = 1, 2, 3, ...
  let title, desc;
  let timeLimit = 0;        // seconds; 0 = no timer
  let pursuers = 0;
  let pursuersShoot = false;
  let reward = 200 + n * 100;
  if (n === 1) {
    title = 'DELIVERY';
    desc = 'Pega o pacote no marker amarelo e entrega no verde. Sem pressão, é só dirigir.';
  } else if (n === 2) {
    title = 'DELIVERY · TIMER';
    desc = 'Mesmo lance, mas agora tem prazo. Acelera, fera.';
    timeLimit = 50;
  } else if (n === 3) {
    title = 'DELIVERY · CHASE';
    desc = 'Um carro vermelho vai começar a te perseguir depois que pegar o pacote. Não deixa ele bater em você.';
    timeLimit = 55;
    pursuers = 1;
  } else if (n === 4) {
    title = 'DELIVERY · CHASE x2';
    desc = 'Dois perseguidores. Pisa fundo.';
    timeLimit = 55;
    pursuers = 2;
  } else if (n === 5) {
    title = 'DELIVERY · ARMED';
    desc = 'Os perseguidores estão atirando agora. Foge.';
    timeLimit = 60;
    pursuers = 2;
    pursuersShoot = true;
  } else {
    // 6+: scaling
    const k = n - 5;
    title = `DELIVERY · HARDCORE ${k}`;
    desc = `Mais perseguidores, menos tempo. Boa sorte.`;
    timeLimit = Math.max(40, 60 - k*2);
    pursuers = 2 + Math.min(k, 3);
    pursuersShoot = true;
  }
  return { n, title, desc, timeLimit, pursuers, pursuersShoot, reward };
}

const missionState = {
  n: 0,
  cfg: null,
  phase: 'briefing', // briefing | pickup | dropoff | done
  pickupPos: null, dropoffPos: null,
  marker: null,
  timeLeft: 0,
  pursuersSpawned: false,
};

const missionTextEl = document.getElementById('mission-text');
const missionRewardEl = document.getElementById('mission-reward');
const missionDistEl = document.getElementById('mission-dist');
const missionTimerEl = document.getElementById('mission-timer');
const missionNumEl = document.getElementById('mission-num');

const briefingEl = document.getElementById('briefing');
const brfNumEl = document.getElementById('brf-num');
const brfTitleEl = document.getElementById('brf-title');
const brfDescEl = document.getElementById('brf-desc');
const brfRewardEl = document.getElementById('brf-reward');
const brfTimeEl = document.getElementById('brf-time');
const brfPursuersEl = document.getElementById('brf-pursuers');
document.getElementById('brf-go').addEventListener('click', startMission);

function clearMarker() {
  if (missionState.marker) { scene.remove(missionState.marker); missionState.marker = null; }
}
function spawnMarker(pos, color) {
  const g = new THREE.Group();
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(4, 32),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.45 })
  );
  disc.rotation.x = -Math.PI/2; disc.position.y = 0.05; g.add(disc);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(3, 0.4, 8, 24),
    new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.8 })
  );
  ring.rotation.x = Math.PI/2; ring.position.y = 1.5; g.add(ring);
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(2.5, 2.5, 30, 24, 1, true),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.18, side: THREE.DoubleSide })
  );
  beam.position.y = 15; g.add(beam);
  const innerBeam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.6, 0.6, 30, 12, 1, true),
    new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.5, side: THREE.DoubleSide })
  );
  innerBeam.position.y = 15; g.add(innerBeam);
  g.position.copy(pos);
  scene.add(g);
  return g;
}
function pickRoadPos() {
  const x = roadLines[Math.floor(Math.random()*roadLines.length)] + (Math.random()-0.5) * 4;
  const z = roadLines[Math.floor(Math.random()*roadLines.length)] + (Math.random()-0.5) * 4;
  return new THREE.Vector3(x, 0, z);
}

// ============= pursuer system =============
const pursuers = []; // {mesh, pos, vel, heading, hp, shootCd, dead, radius}
const bullets = [];

function clearPursuers() {
  for (const p of pursuers) scene.remove(p.mesh);
  pursuers.length = 0;
  for (const b of bullets) scene.remove(b.mesh);
  bullets.length = 0;
}
function spawnPursuer(pos) {
  const car = makeCar(0xC73E1D, 0x000);
  car.position.copy(pos);
  scene.add(car);
  pursuers.push({
    mesh: car, pos: pos.clone(),
    vel: 0, heading: 0,
    hp: 100, shootCd: 1.5 + Math.random(), dead: false, radius: 1.6
  });
}

const bulletGeo = new THREE.SphereGeometry(0.18, 6, 6);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xE94B5C });
function spawnBullet(origin, dir) {
  const mesh = new THREE.Mesh(bulletGeo, bulletMat);
  mesh.position.copy(origin); scene.add(mesh);
  bullets.push({ mesh, pos: origin.clone(), dir: dir.clone().normalize(), life: 1.4 });
}

// ============= briefing & flow =============
function showBriefing(cfg) {
  brfNumEl.textContent = cfg.n;
  brfTitleEl.textContent = cfg.title;
  brfDescEl.textContent = cfg.desc;
  brfRewardEl.textContent = '$' + cfg.reward;
  brfTimeEl.textContent = cfg.timeLimit ? cfg.timeLimit + 's' : '∞';
  brfPursuersEl.textContent = cfg.pursuers + (cfg.pursuersShoot ? ' (armado)' : '');
  briefingEl.classList.add('on');
  missionState.phase = 'briefing';
  missionTextEl.textContent = 'Briefing — clica COMEÇAR';
  missionDistEl.textContent = '';
  missionTimerEl.textContent = '';
  missionRewardEl.textContent = '$' + cfg.reward;
  missionNumEl.textContent = '#' + cfg.n;
}
function startMission() {
  briefingEl.classList.remove('on');
  const cfg = missionState.cfg;
  let p, d;
  do { p = pickRoadPos(); } while (p.distanceTo(playerState.pos) < 18);
  do { d = pickRoadPos(); } while (d.distanceTo(p) < 30);
  missionState.pickupPos = p;
  missionState.dropoffPos = d;
  missionState.phase = 'pickup';
  missionState.timeLeft = cfg.timeLimit;
  missionState.pursuersSpawned = false;
  clearMarker();
  missionState.marker = spawnMarker(p, 0xFFD24A);
  missionTextEl.textContent = '🟡 Pega o pacote';
}
function nextMission() {
  missionState.n += 1;
  missionState.cfg = getMissionConfig(missionState.n);
  clearMarker(); clearPursuers();
  showBriefing(missionState.cfg);
}
function failMission(reason) {
  toast(reason, true);
  clearMarker(); clearPursuers();
  playerState.cash = Math.max(0, Math.floor(playerState.cash * 0.8));
  playerState.hp = 100;
  // restart same mission
  setTimeout(() => showBriefing(missionState.cfg), 1200);
  missionState.phase = 'failed';
}
function onPickup() {
  missionState.phase = 'dropoff';
  clearMarker();
  missionState.marker = spawnMarker(missionState.dropoffPos, 0x9EF67C);
  missionTextEl.textContent = '🟢 Entrega o pacote';
  toast('PEGOU O PACOTE');
  // spawn pursuers now
  if (!missionState.pursuersSpawned && missionState.cfg.pursuers > 0) {
    missionState.pursuersSpawned = true;
    for (let i = 0; i < missionState.cfg.pursuers; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 22 + Math.random() * 6;
      const sp = new THREE.Vector3(
        playerState.pos.x + Math.cos(angle) * dist, 0,
        playerState.pos.z + Math.sin(angle) * dist
      );
      spawnPursuer(sp);
    }
    setTimeout(() => toast('!! PERSEGUIDORES'), 400);
  }
}
function onDelivery() {
  playerState.cash += missionState.cfg.reward;
  playerState.jobs += 1;
  toast(`+$${missionState.cfg.reward}  ENTREGUE`);
  clearMarker(); clearPursuers();
  setTimeout(nextMission, 1500);
  missionState.phase = 'done';
  missionTextEl.textContent = 'Próxima missão chegando…';
  missionTimerEl.textContent = '';
}

// ============= toast =============
const toastEl = document.getElementById('toast');
let toastT = 0;
function toast(msg, bad=false) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('bad', !!bad);
  toastEl.classList.add('on');
  toastT = 1.6;
}

// ============= input =============
const keys = {};
window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============= helpers =============
function fwdVec(h) { return new THREE.Vector3(Math.sin(h), 0, -Math.cos(h)); }
function blockedAt(x, z, radius) {
  for (const b of buildingObstacles) {
    const dx = Math.abs(x - b.pos.x), dz = Math.abs(z - b.pos.y);
    if (dx < b.halfX + radius && dz < b.halfZ + radius) return true;
  }
  return false;
}

// ============= HUD =============
const cashEl = document.getElementById('cash');
const jobsEl = document.getElementById('jobs');
const speedEl = document.getElementById('speed');
const hpEl = document.getElementById('hp-fill');
const edgeArrowEl = document.getElementById('edge-arrow');
function syncHUD() {
  cashEl.textContent = '$' + playerState.cash;
  jobsEl.textContent = playerState.jobs;
  hpEl.style.width = Math.max(0, playerState.hp) + '%';
}

// ============= main loop =============
const clock = new THREE.Clock();
let elapsed = 0;
nextMission();

function update(dt) {
  elapsed += dt;

  // Don't update gameplay during briefing
  const playing = missionState.phase === 'pickup' || missionState.phase === 'dropoff';

  // ---- driving ----
  const accel = (keys['KeyW']||keys['ArrowUp']) ? 22 : 0;
  const brake = (keys['KeyS']||keys['ArrowDown']) ? 18 : 0;
  const handBrake = keys['Space'] ? 1 : 0;
  const steerL = (keys['KeyA']||keys['ArrowLeft']) ? 1 : 0;
  const steerR = (keys['KeyD']||keys['ArrowRight']) ? 1 : 0;

  playerState.vel += (accel - brake) * dt;
  playerState.vel *= (1 - dt * (handBrake ? 4 : 0.7));
  playerState.vel = Math.max(-12, Math.min(32, playerState.vel));

  const steer = (steerR - steerL) * Math.min(Math.abs(playerState.vel)/6, 1.0);
  playerState.heading += steer * dt * 2.4 * Math.sign(playerState.vel || 1);

  const fwd = fwdVec(playerState.heading);
  const nx = playerState.pos.x + fwd.x * playerState.vel * dt;
  const nz = playerState.pos.z + fwd.z * playerState.vel * dt;
  let cx = playerState.pos.x, cz = playerState.pos.z;
  if (!blockedAt(nx, cz, playerState.radius)) cx = nx; else playerState.vel *= 0.6;
  if (!blockedAt(cx, nz, playerState.radius)) cz = nz; else playerState.vel *= 0.6;
  playerState.pos.x = Math.max(-WORLD/2+5, Math.min(WORLD/2-5, cx));
  playerState.pos.z = Math.max(-WORLD/2+5, Math.min(WORLD/2-5, cz));

  player.position.copy(playerState.pos);
  player.rotation.y = Math.PI - playerState.heading;

  // ---- mission ----
  let target = null;
  if (missionState.phase === 'pickup') target = missionState.pickupPos;
  else if (missionState.phase === 'dropoff') target = missionState.dropoffPos;

  if (target) {
    const dist = playerState.pos.distanceTo(target);
    missionDistEl.textContent = `${Math.round(dist)}m`;
    if (dist < 4) {
      if (missionState.phase === 'pickup') onPickup();
      else if (missionState.phase === 'dropoff') onDelivery();
    }
  } else {
    missionDistEl.textContent = '';
  }

  // timer
  if (playing && missionState.cfg.timeLimit > 0) {
    missionState.timeLeft -= dt;
    if (missionState.timeLeft <= 0) {
      missionState.timeLeft = 0;
      failMission('TEMPO ESGOTADO');
    }
    const t = Math.ceil(missionState.timeLeft);
    missionTimerEl.textContent = `⏱ ${t}s`;
    missionTimerEl.classList.toggle('ok', t > 15);
  } else {
    missionTimerEl.textContent = '';
  }

  // marker pulse + spin
  if (missionState.marker) {
    missionState.marker.rotation.y += dt * 1.2;
    const s = 1 + Math.sin(elapsed * 4) * 0.08;
    missionState.marker.children[1].scale.set(s, s, s);
  }

  // big floating arrow
  arrow.position.set(playerState.pos.x, 5 + Math.sin(elapsed*3)*0.3, playerState.pos.z);
  if (target) {
    const dx = target.x - playerState.pos.x;
    const dz = target.z - playerState.pos.z;
    arrow.rotation.y = Math.atan2(dx, dz);
    arrow.visible = true;
  } else {
    arrow.visible = false;
  }

  // edge arrow
  if (target) {
    const v = target.clone().project(camera);
    if (v.x < -1 || v.x > 1 || v.y < -1 || v.y > 1 || v.z > 1) {
      const sxc = window.innerWidth/2, syc = window.innerHeight/2;
      let dx = (v.x*0.5+0.5)*window.innerWidth - sxc;
      let dy = (-v.y*0.5+0.5)*window.innerHeight - syc;
      if (v.z > 1) { dx = -dx; dy = -dy; }
      const margin = 60;
      const ax = Math.abs(dx), ay = Math.abs(dy);
      const aspect = (window.innerWidth/2 - margin) / (window.innerHeight/2 - margin);
      let scale;
      if (ax/ay > aspect) scale = (window.innerWidth/2 - margin) / ax;
      else scale = (window.innerHeight/2 - margin) / ay;
      const ex = sxc + dx*scale, ey = syc + dy*scale;
      edgeArrowEl.style.left = ex + 'px';
      edgeArrowEl.style.top = ey + 'px';
      edgeArrowEl.style.transform = `translate(-50%,-50%) rotate(${Math.atan2(dy, dx) - Math.PI/2}rad)`;
      edgeArrowEl.style.display = 'block';
    } else {
      edgeArrowEl.style.display = 'none';
    }
  } else {
    edgeArrowEl.style.display = 'none';
  }

  // ---- pursuers ----
  if (playerState.invuln > 0) playerState.invuln -= dt;
  for (const p of pursuers) {
    if (p.dead) continue;
    const toP = new THREE.Vector3(playerState.pos.x - p.pos.x, 0, playerState.pos.z - p.pos.z);
    const dist = toP.length();
    const desired = Math.atan2(toP.x, -toP.z);
    let dh = desired - p.heading;
    while (dh > Math.PI) dh -= Math.PI*2;
    while (dh < -Math.PI) dh += Math.PI*2;
    p.heading += Math.sign(dh) * Math.min(Math.abs(dh), dt * 1.6);

    const targetSpeed = playing ? 20 : 0;
    p.vel += (targetSpeed - p.vel) * dt * 1.0;

    const ef = fwdVec(p.heading);
    const enx = p.pos.x + ef.x * p.vel * dt;
    const enz = p.pos.z + ef.z * p.vel * dt;
    let ecx = p.pos.x, ecz = p.pos.z;
    if (!blockedAt(enx, ecz, p.radius)) ecx = enx; else p.heading += 0.4;
    if (!blockedAt(ecx, enz, p.radius)) ecz = enz; else p.heading += 0.4;
    p.pos.x = ecx; p.pos.z = ecz;
    p.mesh.position.copy(p.pos);
    p.mesh.rotation.y = Math.PI - p.heading;

    // ram damage on contact
    if (dist < playerState.radius + p.radius + 0.4 && playerState.invuln <= 0) {
      playerState.hp -= 14;
      playerState.invuln = 0.6;
      // bounce player off
      const nrm = toP.clone().normalize();
      playerState.pos.x -= nrm.x * 1.0;
      playerState.pos.z -= nrm.z * 1.0;
      playerState.vel *= -0.4;
    }

    // shooting (mission 5+)
    if (missionState.cfg.pursuersShoot && dist < 28 && playing) {
      p.shootCd -= dt;
      if (p.shootCd <= 0) {
        p.shootCd = 1.0 + Math.random()*0.4;
        const dir = toP.clone().normalize();
        const origin = p.pos.clone().add(new THREE.Vector3(dir.x*1.5, 1.0, dir.z*1.5));
        spawnBullet(origin, dir);
      }
    }
  }

  // ---- bullets (enemy only) ----
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    b.pos.x += b.dir.x * 55 * dt;
    b.pos.z += b.dir.z * 55 * dt;
    b.mesh.position.copy(b.pos);
    let hit = false;
    const dx = b.pos.x - playerState.pos.x, dz = b.pos.z - playerState.pos.z;
    if (dx*dx + dz*dz < (playerState.radius+0.4)**2) {
      if (playerState.invuln <= 0) {
        playerState.hp -= 8;
        playerState.invuln = 0.15;
      }
      hit = true;
    }
    if (hit || b.life <= 0) { scene.remove(b.mesh); bullets.splice(i,1); }
  }

  // hp regen out of pursuit
  if (playing && pursuers.length === 0 && playerState.hp < 100) {
    playerState.hp = Math.min(100, playerState.hp + dt * 6);
  }

  // dead → fail mission
  if (playing && playerState.hp <= 0) {
    playerState.hp = 0;
    failMission('VOCÊ FOI DESTRUÍDO');
  }

  // ---- toast fade ----
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('on'); }

  // ---- camera ----
  camera.position.set(playerState.pos.x, 60, playerState.pos.z + 12);
  camera.lookAt(playerState.pos.x, 0, playerState.pos.z);

  speedEl.firstChild.textContent = Math.round(Math.abs(playerState.vel) * 5);
  syncHUD();
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
